services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartspend
      POSTGRES_USER: smartspend
      POSTGRES_PASSWORD: smartspend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartspend"]
      interval: 5s
      retries: 10
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: smartspend
      POSTGRES_USER: smartspend
      POSTGRES_PASSWORD: smartspend
      POSTGRES_HOST: db
      DJANGO_DEBUG: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
